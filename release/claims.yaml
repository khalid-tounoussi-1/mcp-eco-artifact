# Inventory numbers of the MCP-Eco paper and the command that regenerates each.
# Units are stored table rows from Parquet footers, not validated MCP entities.
# The dataset identity is pinned in release/source.json.
#
# Commands run from the repository root and read <repository>/data by default.
# scripts/check_claims.py first verifies the complete release with
# `python scripts/verify_release.py --check`, then runs every command below.
#
# The manuscript is not distributed in this repository. `where` names the part
# of the manuscript that states each number.
paper: "MCP-Eco: Mining Both Sides of the Model Context Protocol (MCP) Ecosystem"
claims:
- id: table_count
  value: 19
  text: '19'
  where: Frozen release inventory
  unit: exported table
  cmd: python scripts/verify_release.py --emit table_count
